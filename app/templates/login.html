<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · AI 机票搜索</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef1ff,#f7f4fb);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#263047;padding:24px}.card{width:100%;max-width:420px;padding:36px;background:white;border-radius:16px;box-shadow:0 12px 40px #28386614}h1{font-size:24px;margin:0 0 10px}p{color:#73798a;font-size:14px;line-height:1.6}label{display:block;margin-top:20px;font-size:14px}input{width:100%;padding:12px;margin-top:8px;border:1px solid #d7dcf7;border-radius:8px;font-size:16px}input:focus{outline:2px solid #667eea}button{cursor:pointer;border:0;border-radius:8px;font-size:15px}.submit{width:100%;padding:13px;background:#667eea;color:white;margin-top:24px}.submit:disabled{opacity:.6}.switch{display:block;margin:20px auto 0;background:none;color:#5367e8}#error{color:#c23848;font-size:14px;margin-top:16px}small{display:block;color:#73798a;margin-top:6px}
</style>
</head>
<body><main class="card">
<h1 id="title">登录 AI 机票搜索</h1><p>登录后搜索机票、查看价格走势和管理监控航线。</p>
<form id="auth-form">
<label for="username">账号</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="64" pattern="[a-zA-Z0-9_\-]+" autofocus><small>3–64 位字母、数字、下划线或短横线</small>
<label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"><small>8–128 个字符</small>
<div id="error" role="alert" aria-live="polite"></div><button class="submit" id="submit" type="submit">登录</button>
</form><button class="switch" id="switch" type="button">没有账号？注册账号</button>
</main>
<script>
let registering = false;
const form = document.getElementById('auth-form'), submit = document.getElementById('submit'), error = document.getElementById('error');
document.getElementById('switch').onclick = () => {
    registering = !registering;
    document.getElementById('title').textContent = registering ? '注册账号' : '登录 AI 机票搜索';
    submit.textContent = registering ? '注册并登录' : '登录';
    document.getElementById('switch').textContent = registering ? '已有账号？返回登录' : '没有账号？注册账号';
    document.getElementById('password').autocomplete = registering ? 'new-password' : 'current-password';
    error.textContent = '';
};
form.onsubmit = async (event) => {
    event.preventDefault(); submit.disabled = true; error.textContent = '';
    try {
        const response = await fetch('/api/auth/' + (registering ? 'register' : 'login'), {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({username:form.username.value.trim(), password:form.password.value})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : '请检查账号和密码格式');
        window.location.replace('/');
    } catch (err) { error.textContent = err.message || '连接失败，请重试'; }
    finally { submit.disabled = false; }
};
</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 机票搜索</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px 32px; }
        .header h1 { font-size: 24px; font-weight: 600; }
        .header p { opacity: 0.85; margin-top: 4px; font-size: 14px; }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .header-link { color: white; text-decoration: none; border: 1px solid rgba(255,255,255,.45); border-radius: 8px; padding: 8px 14px; font-size: 13px; white-space: nowrap; }
        .header-link:hover { background: rgba(255,255,255,.12); }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 16px; color: #666; margin-bottom: 16px; }
        .form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 13px; color: #888; }
        .form-group input, .form-group select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #667eea; }
        .btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-danger { background: #ff4757; color: white; }
        .btn-danger:hover { background: #e83c4d; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .route-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
        .route-tag { background: #f0f2f5; padding: 8px 14px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .route-tag .delete { cursor: pointer; color: #999; font-size: 16px; }
        .route-tag .delete:hover { color: #ff4757; }
        .price-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
        .price-card { background: #f8f9ff; border-radius: 8px; padding: 16px; border-left: 4px solid #667eea; }
        .price-card .route { font-weight: 600; font-size: 15px; }
        .price-card .price { font-size: 28px; font-weight: 700; color: #667eea; margin: 8px 0; }
        .price-card .meta { font-size: 12px; color: #999; }
        #chart { width: 100%; height: 400px; }
        #aiPriceChart { width: 100%; height: 380px; }
        .route-select { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
        .empty { text-align: center; color: #999; padding: 40px; }
        .ai-card { border: 1px solid #e5e8ff; }
        .search-box { display: flex; gap: 12px; }
        .search-box input { flex: 1; padding: 13px 16px; border: 1px solid #d7dcf7; border-radius: 9px; font-size: 15px; outline: none; }
        .search-box input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,.12); }
        .search-box .btn { min-width: 120px; }
        .hint, .warning { margin-top: 10px; color: #8a8f9f; font-size: 12px; line-height: 1.6; }
        .warning { padding: 10px 12px; border-radius: 7px; color: #8a6415; background: #fff8e6; }
        .status { padding: 28px; text-align: center; color: #667eea; }
        .offer-list { display: grid; gap: 12px; margin-top: 16px; }
        .offer { padding: 16px; border: 1px solid #eaecf5; border-radius: 9px; display: grid; grid-template-columns: 1fr auto; gap: 12px; }
        .offer-main { min-width: 0; }
        .offer-route { font-weight: 650; }
        .offer-meta, .offer-evidence { margin-top: 7px; color: #73798a; font-size: 13px; line-height: 1.5; }
        .offer-price { color: #667eea; font-weight: 750; font-size: 24px; white-space: nowrap; }
        .offer a { color: #667eea; text-decoration: none; }
        @media (max-width: 640px) { .search-box { flex-direction: column; } .offer { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div>
                <h1>AI 机票搜索</h1>
                <p>LangChain 调度 Tavily 联网检索，帮你发现公开网页中的机票参考价</p>
            </div>
            <a class="header-link" href="/dashboard">查看数据看板 →</a>
        </div>
    </div>
    <div class="container">
        <div class="card ai-card">
            <h2>告诉 AI 你的行程</h2>
            <div class="search-box">
                <input id="aiQuery" placeholder="例如：9 月 10 日北京飞东京，1 人单程经济舱" onkeydown="if(event.key==='Enter') searchWithAI()" />
                <button id="aiSearchBtn" class="btn btn-primary" onclick="searchWithAI()">联网查询</button>
            </div>
            <div class="hint">请尽量包含出发地、目的地、日期、单程/往返、人数和舱位。结果是网页参考价，不代表实时库存。</div>
            <div id="aiResults"></div>
        </div>

        <div class="card">
            <h2>AI 搜索价格走势</h2>
            <div class="hint" id="aiTrendNote">折线展示每次联网搜索中可确认报价的最低值。</div>
            <div id="aiPriceChart"></div>
        </div>

        <!-- 添加航线 -->
        <div class="card">
            <h2>添加监控航线</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>出发城市 (IATA)</label>
                    <input id="dep" placeholder="PEK" />
                </div>
                <div class="form-group">
                    <label>到达城市 (IATA)</label>
                    <input id="arr" placeholder="SHA" />
                </div>
                <div class="form-group">
                    <label>航空公司</label>
                    <input id="airline" placeholder="可选" />
                </div>
                <button class="btn btn-primary" onclick="addRoute()">添加</button>
            </div>
            <div class="route-list" id="routeList"></div>
        </div>

        <!-- 最新价格 -->
        <div class="card">
            <h2>最新价格</h2>
            <div class="price-cards" id="priceCards">
                <div class="empty">暂无数据，请先添加航线并抓取价格</div>
            </div>
        </div>

        <!-- 价格趋势 -->
        <div class="card">
            <h2>价格趋势</h2>
            <div class="route-select">
                <select id="chartRoute" onchange="loadChart()">
                    <option value="">选择航线</option>
                </select>
            </div>
            <div id="chart"></div>
        </div>
    </div>

    <script>
        let routes = [];
        let chart = echarts.init(document.getElementById('chart'));
        let aiPriceChart = echarts.init(document.getElementById('aiPriceChart'));

        async function api(path, opts) {
            const resp = await fetch(path, opts);
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.detail || `请求失败 (${resp.status})`);
            return data;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
        }

        async function searchWithAI() {
            const query = document.getElementById('aiQuery').value.trim();
            if (query.length < 3) return alert('请描述你的行程');
            const button = document.getElementById('aiSearchBtn');
            const results = document.getElementById('aiResults');
            button.disabled = true;
            button.textContent = '查询中…';
            results.innerHTML = '<div class="status">AI 正在规划检索并阅读网页，通常需要十几秒…</div>';
            try {
                const data = await api('/api/ai/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query})
                });
                const offers = data.offers || [];
                results.innerHTML = `
                    <div class="offer-evidence">${escapeHtml(data.summary)}</div>
                    ${offers.length ? `<div class="offer-list">${offers.map(renderOffer).join('')}</div>` : '<div class="empty">没有找到可确认的公开价格，请补充日期或换一个描述重试。</div>'}
                    <div class="warning">${escapeHtml(data.warning)}</div>`;
                if (offers.length) loadAiPriceTrend(offers[0].departure, offers[0].arrival);
            } catch (error) {
                results.innerHTML = `<div class="warning">${escapeHtml(error.message)}</div>`;
            } finally {
                button.disabled = false;
                button.textContent = '联网查询';
            }
        }

        function renderOffer(offer) {
            const price = offer.price == null ? '价格未确认' : `${escapeHtml(offer.currency)} ${Number(offer.price).toLocaleString()}`;
            return `<div class="offer">
                <div class="offer-main">
                    <div class="offer-route">${escapeHtml(offer.departure)} → ${escapeHtml(offer.arrival)}</div>
                    <div class="offer-meta">${escapeHtml(offer.airline)} ${escapeHtml(offer.flight_number || '')} · ${escapeHtml(offer.cabin_class)} · ${escapeHtml(offer.departure_time || '时间未确认')}</div>
                    <div class="offer-evidence">${escapeHtml(offer.evidence)} · <a href="${escapeHtml(offer.source_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(offer.source_title)}</a></div>
                </div>
                <div class="offer-price">${price}</div>
            </div>`;
        }

        async function loadAiPriceTrend(departure = '', arrival = '') {
            const params = new URLSearchParams({limit: '100'});
            if (departure) params.set('departure', departure);
            if (arrival) params.set('arrival', arrival);
            try {
                const data = await api(`/api/ai/price-trends?${params}`);
                document.getElementById('aiTrendNote').textContent = `${data.note} 当前观测点：${data.total_points}`;
                if (!data.series.length) {
                    aiPriceChart.clear();
                    aiPriceChart.setOption({title: {text: '暂无 AI 价格历史', subtext: '完成联网查询后将在这里形成趋势', left: 'center', top: 'center'}});
                    return;
                }
                const timestamps = [...new Set(data.series.flatMap(s => s.points.map(p => p.searched_at)))].sort();
                aiPriceChart.setOption({
                    title: {text: departure && arrival ? `${departure} → ${arrival}` : 'AI 搜索最低参考价', left: 'center'},
                    tooltip: {trigger: 'axis'},
                    legend: {top: 30, type: 'scroll'},
                    grid: {left: 70, right: 30, bottom: 60, top: 75},
                    xAxis: {type: 'category', data: timestamps.map(t => new Date(t).toLocaleString()), axisLabel: {rotate: 25}},
                    yAxis: {type: 'value', name: '参考价', scale: true},
                    series: data.series.map(s => {
                        const values = new Map(s.points.map(p => [p.searched_at, p.min_price]));
                        return {
                            name: `${s.departure} → ${s.arrival} (${s.currency})`,
                            type: 'line',
                            data: timestamps.map(t => values.has(t) ? values.get(t) : null),
                            connectNulls: false,
                            smooth: false,
                            symbol: 'circle',
                            symbolSize: 7,
                            lineStyle: {width: 2},
                            emphasis: {focus: 'series'}
                        };
                    })
                }, true);
            } catch (error) {
                document.getElementById('aiTrendNote').textContent = `价格趋势加载失败：${error.message}`;
            }
        }

        async function loadRoutes() {
            routes = await api('/api/routes/');
            renderRoutes();
            renderRouteSelect();
            loadLatestPrices();
        }

        function renderRoutes() {
            const el = document.getElementById('routeList');
            if (!routes.length) { el.innerHTML = '<span style="color:#999">暂无航线</span>'; return; }
            el.innerHTML = routes.map(r =>
                `<div class="route-tag">
                    ${r.departure_city} → ${r.arrival_city} ${r.airline ? '(' + r.airline + ')' : ''}
                    <span class="delete" onclick="deleteRoute(${r.id})">×</span>
                </div>`
            ).join('');
        }

        function renderRouteSelect() {
            const sel = document.getElementById('chartRoute');
            sel.innerHTML = '<option value="">选择航线</option>' +
                routes.map(r => `<option value="${r.id}">${r.departure_city} → ${r.arrival_city}</option>`).join('');
        }

        async function addRoute() {
            const dep = document.getElementById('dep').value.trim();
            const arr = document.getElementById('arr').value.trim();
            const airline = document.getElementById('airline').value.trim();
            if (!dep || !arr) return alert('请填写出发和到达城市');
            await api('/api/routes/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({departure_city: dep, arrival_city: arr, airline})
            });
            document.getElementById('dep').value = '';
            document.getElementById('arr').value = '';
            document.getElementById('airline').value = '';
            loadRoutes();
        }

        async function deleteRoute(id) {
            await api(`/api/routes/${id}`, {method: 'DELETE'});
            loadRoutes();
        }

        async function loadLatestPrices() {
            const data = await api('/api/prices/latest');
            const el = document.getElementById('priceCards');
            if (!data.length) { el.innerHTML = '<div class="empty">暂无数据，请先添加航线并抓取价格</div>'; return; }
            el.innerHTML = data.map(p =>
                `<div class="price-card">
                    <div class="route">${p.departure} → ${p.arrival}</div>
                    <div class="price">¥${p.price.toFixed(0)}</div>
                    <div class="meta">${p.airline || '-'} · ${p.cabin_class} · ${new Date(p.scraped_at).toLocaleString()}</div>
                </div>`
            ).join('');
        }

        async function loadChart() {
            const routeId = document.getElementById('chartRoute').value;
            if (!routeId) return;
            const data = await api(`/api/prices/${routeId}?limit=50`);
            if (!data.length) {
                chart.setOption({title: {text: '暂无价格数据', left: 'center', top: 'center'}});
                return;
            }
            const sorted = data.reverse();
            chart.setOption({
                title: {text: '价格走势', left: 'center'},
                tooltip: {trigger: 'axis', formatter: p => `${p[0].axisValue}<br/>¥${p[0].value}`},
                xAxis: {type: 'category', data: sorted.map(p => new Date(p.scraped_at).toLocaleDateString()), axisLabel: {rotate: 30}},
                yAxis: {type: 'value', name: '价格(元)', axisLabel: {formatter: '¥{value}'}},
                series: [{
                    type: 'line',
                    data: sorted.map(p => p.price),
                    smooth: true,
                    areaStyle: {color: 'rgba(102,126,234,0.15)'},
                    lineStyle: {color: '#667eea', width: 2},
                    itemStyle: {color: '#667eea'}
                }],
                grid: {left: 60, right: 30, bottom: 60, top: 50}
            });
        }

        window.addEventListener('resize', () => { chart.resize(); aiPriceChart.resize(); });
        loadAiPriceTrend();
        loadRoutes();
    </script>
</body>
</html>
